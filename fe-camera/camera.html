<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>촬영하기 | 클래시파이</title>

  <!-- 색상/폰트/버튼 등 공통 스타일 (fe-ui 팀원이 추후 작성 예정) -->
  <link rel="stylesheet" href="../fe-ui/css/common.css" />
  <!-- 카메라 뷰 + 로딩 오버레이 전용 스타일 -->
  <link rel="stylesheet" href="css/camera.css" />
</head>
<body>

  <!-- 02_카메라 촬영 화면 -->
  <div id="camera-view" class="camera-view">
    <header class="camera-header">
      <button id="back-btn" class="back-btn" aria-label="뒤로가기">&#8249;</button>
      <h1 class="header-title">촬영하기</h1>
    </header>

    <p class="camera-guide">폐기물을 네모 박스 안에 맞춰주세요</p>

    <div class="camera-viewfinder">
      <video id="camera-stream" autoplay playsinline muted></video>
      <span class="corner corner-top-left"></span>
      <span class="corner corner-top-right"></span>
      <span class="corner corner-bottom-left"></span>
      <span class="corner corner-bottom-right"></span>
    </div>

    <p id="camera-error" class="camera-error" hidden></p>

    <div class="shutter-area">
      <button id="shutter-btn" class="shutter-btn" aria-label="촬영하기"></button>
      <p class="shutter-hint">탭하여 촬영</p>
    </div>
  </div>

  <!-- 03_분석 중 로딩 화면 (같은 페이지 내 오버레이 상태, 기본은 숨김) -->
  <div id="loading-view" class="loading-view" hidden>
    <div class="spinner"></div>
    <h2 class="loading-title">분석 중입니다...</h2>
    <p class="loading-desc">AI가 이미지를 분석해서<br />정확한 분리배출 방법을 안내해드릴게요</p>
  </div>

  <!-- 프레임 캡처용 캔버스 (화면에 보이지 않음) -->
  <canvas id="capture-canvas" hidden></canvas>

  <script src="js/api.js"></script>
  <script src="js/camera.js"></script>
</body>
</html>
