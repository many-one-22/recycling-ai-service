<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 분리배출 안내 서비스</title>
    <style>
        /* CSS: 화면을 예쁘게 꾸미는 부분 */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f9f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #2e7d32;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .upload-btn {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            margin-bottom: 15px;
        }
        .upload-btn:hover {
            background-color: #388e3c;
        }
        .sub-btn {
            background-color: #e0e0e0;
            color: #333;
            border: none;
            padding: 12px 20px;
            font-size: 14px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>에코스캔 ♻️</h1>
        <p>생활폐기물 사진을 찍어서 올리면<br>AI가 올바른 분리배출 방법을 알려드립니다.</p>
        
        <button class="upload-btn">📷 사진 촬영하기</button>
        
        <button class="sub-btn">🖼️ 갤러리에서 선택</button>
    </div>

</body>
</html>
