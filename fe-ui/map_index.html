<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>광주 수거함 지도</title>
    <link rel="stylesheet" href="map_style.css">
    <!-- 카카오맵 연결 -->
    <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=bb36dcae71f478cb83c744e014acb7b5&libraries=services"></script>
</head>
<body>
    <div class="app-layout">
        <!-- 상단 헤더 영역 -->
        <header class="app-header">
            <button class="back-btn" onclick="history.back()">‹</button>
            <h1 class="header-title">광주 수거함 지도 ♻️️</h1>
        </header>

        <!-- 검색창 -->
        <div class="search-wrapper">
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="동 이름이나 센터명을 검색하세요 (예: 용봉동)" onkeyup="if(event.keyCode===13) searchLocation()">
                <button class="search-btn" onclick="searchLocation()" aria-label="검색">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#212529" stroke-width="2.5">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </div>
        </div>

        <!-- 품목 카테고리 필터 -->
        <div class="filter-wrapper">
            <div class="filter-scroll">
                <button class="chip active" data-category="전체" onclick="onFilterClick(this)">전체</button>
                <button class="chip" data-category="폐건전지" onclick="onFilterClick(this)">폐건전지</button>
                <button class="chip" data-category="종이팩" onclick="onFilterClick(this)">종이팩</button>
                <button class="chip" data-category="폐의약품" onclick="onFilterClick(this)">폐의약품</button>
                <button class="chip" data-category="폐형광등" onclick="onFilterClick(this)">폐형광등</button>
                <button class="chip" data-category="소형가전" onclick="onFilterClick(this)">소형가전</button>
                <button class="chip" data-category="투명페트병" onclick="onFilterClick(this)">투명페트병</button>
                <button class="chip" data-category="아이스팩" onclick="onFilterClick(this)">아이스팩</button>
            </div>
        </div>

        <!-- 지도 영역 -->
        <main class="map-container">
            <div id="map"></div>
            <!-- 내 위치 이동 버튼 -->
            <button class="my-location-btn" onclick="moveToCurrentLocation()" aria-label="내 위치">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#191f28" stroke-width="2">
                    <circle cx="12" cy="12" r="8"></circle>
                    <line x1="12" y1="2" x2="12" y2="6"></line>
                    <line x1="12" y1="18" x2="12" y2="22"></line>
                    <line x1="2" y1="12" x2="6" y2="12"></line>
                    <line x1="18" y1="12" x2="22" y2="12"></line>
                </svg>
            </button>
        </main>

        <!-- 상세 정보 모달 -->
        <div id="bottom-sheet" class="bottom-sheet">
            <div class="sheet-drag-handle" onclick="closeBottomSheet()"></div>
            <div class="sheet-content">
                <div class="sheet-header">
                    <span id="sheet-gu-badge" class="center-type">구 정보</span>
                    <h2 id="sheet-title">행정복지센터</h2>
                    <p id="sheet-address" class="sheet-address">-</p>
                    <p id="sheet-phone" class="sheet-phone">-</p>
                </div>

                <div class="sheet-divider"></div>

                <div class="sheet-section">
                    <h3 class="section-title">수거 가능 품목</h3>
                    <div id="sheet-items" class="items-tags"></div>
                </div>

                <!-- 구별 보상 교환 안내 -->
                <div id="exchange-rules-box" class="sheet-section exchange-info-box" style="display: none;">
                    <div class="info-text">
                        <strong>구별 보상 교환 기준</strong>
                        <ul id="exchange-rules-list" style="margin-top: 4px; padding-left: 0; list-style: none; font-size: 12px; color: #495057;"></ul>
                    </div>
                </div>
                
                <!-- 미확인 품목 안내 -->
                <div id="unverified-box" class="sheet-section unverified-info-box" style="display: none;">
                    <div class="info-text">
                        <strong>확인 필요 품목</strong>
                        <p id="unverified-items-text">일부 품목은 센터 문의 후 방문하세요.</p>
                    </div>
                </div>

                <button class="btn-primary" onclick="closeBottomSheet()">확인</button>
            </div>
        </div>
    </div>

    <script src="map_script.js"></script>
</body>
</html>
