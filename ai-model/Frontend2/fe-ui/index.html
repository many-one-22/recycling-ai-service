<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>클래시파이</title>
  <link rel="stylesheet" href="/fe-ui/style.css">
  <link rel="stylesheet" href="/fe-ui/nav.css">
    <link rel="stylesheet" href="/fe-ui/frame.css">
</head>
<body>
  <div class="mobile-container app-frame">

    <!-- 상단 로그인 상태 영역 -->
    <header class="top-bar">
      <span class="user-chip" id="userChip" hidden></span>
      <a href="/fe-ui/sign_in.html" class="login-link" id="loginLink" hidden>로그인</a>
    </header>

    <!-- 화면 중앙 정렬을 위해 묶어주는 래퍼(Wrapper) -->
    <div class="main-content-wrapper">
      <div class="logo-circle">C</div>
      <div class="sub-title">AI 기반 스마트 분리배출 도우미</div>
      <h1 class="title">클래시파이</h1>
      <p class="description">
        AI 카메라로 폐기물을 촬영하면<br>
        올바른 분리배출 방법을 바로 알려드려요
      </p>

      <!-- 핵심 기능 진입 버튼 -->
      <div class="action-buttons">
        <button type="button" class="btn btn-primary" id="btnCamera">
          <span class="btn-icon">📷</span> 사진 촬영하기
        </button>
        <button type="button" class="btn btn-secondary" id="btnGallery">
          <span class="btn-icon">🖼️</span> 갤러리에서 선택
        </button>
        <!-- 갤러리 선택용 숨김 input -->
        <input type="file" id="galleryInput" accept="image/*" hidden>
      </div>
    </div>

    <!-- 최하단 저작권 / 정보 -->
    <div class="footer-text">
      AICOSS 2026 WE-Meet · 클래시파이
    </div>

    <!-- 하단 내비게이션 바 (nav.js 가 그려줌) -->
    <div id="bottomNav"></div>
    <!-- 분석 중 로딩 화면 -->
    <div class="loading-overlay" id="loadingOverlay" hidden>
      <div class="spinner"></div>
      <p>AI가 분석하고 있어요...</p>
    </div>

    <!-- 안내 메시지(토스트) -->
    <div class="toast" id="toast" hidden></div>

  </div>

  <script src="/fe-ui/nav.js"></script>
  <script src="/fe-ui/index.js"></script>
</body>
</html>
