<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 페이지 | 클래시파이</title>
<link rel="stylesheet" href="/fe-ui/admin.css">
<link rel="stylesheet" href="/fe-ui/nav.css">
<link rel="stylesheet" href="/fe-ui/frame.css">
</head>
<body>
<div class="app-frame admin-frame">
<header>
  <a class="back-link" href="/fe-ui/my_page.html">〈 마이페이지</a>
  <h1>클래시파이 관리자</h1>
</header>
<main>
  <div id="msg"></div>

  <div class="summary">
    <div class="stat"><div class="label">전체 사용자</div><div class="value" id="statUsers">-</div></div>
    <div class="stat"><div class="label">누적 재활용 개수</div><div class="value" id="statCount">-</div></div>
    <div class="stat"><div class="label">대기중 제보</div><div class="value" id="statWait">-</div></div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabUsers" type="button">사용자</button>
    <button class="tab" id="tabReports" type="button">오류 제보</button>
        <button class="tab" id="tabStats" type="button">통계</button>
    <button class="refresh" id="btnRefresh" type="button">새로고침</button>
  </div>

    <div id="panelUsers">
    <div id="usersList"></div>
  </div>

    <div class="hidden" id="panelReports">
    <div class="chips" id="reportFilter">
      <button class="chip active" type="button" data-status="">전체</button>
      <button class="chip" type="button" data-status="대기중">대기중</button>
      <button class="chip" type="button" data-status="처리완료">처리완료</button>
      <button class="chip" type="button" data-status="반려">반려</button>
    </div>
    <div id="reportsList"></div>
  </div>
  
  <div class="hidden" id="panelStats">
    <div class="kpis" id="kpis"></div>
    <div class="chart-card"><h3>최근 7일 재활용 개수</h3><div id="chartDaily"></div></div>
    <div class="chart-card"><h3>품목별 재활용</h3><div id="chartItems"></div></div>
    <div class="chart-card"><h3>사용자 랭킹 TOP 5</h3><div id="chartRank"></div></div>
    <div class="chart-card"><h3>제보 처리 현황</h3><div id="chartReports"></div></div>
  </div>
</main>
<div id="toast"></div>

<!-- 하단 내비게이션 바 (nav.js 가 그려줌) -->
<div id="bottomNav"></div>
</div>

<script src="/fe-ui/nav.js"></script>
<script src="/fe-ui/api-config.js"></script>
<script src="/fe-ui/admin.js"></script>
</body>
</html>
